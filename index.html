<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/購物車.css" />
    <title>島嶼茶室｜飲料菜單與購物車</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳至主要內容</a>
    <header class="site-header" tabindex="-1">
      <div class="page-width header-inner">
        <a class="brand" href="./index.html">島嶼茶室</a>
        <nav aria-label="頁面導覽"></nav>
      </div>
    </header>

    <main class="page-width" id="main-content" tabindex="-1">
      <div class="intro">
        <h1>今天，喝杯茶。</h1>
        <p>從清爽原茶到香醇鮮奶茶，挑一杯喜歡的。</p>
      </div>
      <div class="shop-layout">
        <section id="menu" aria-labelledby="menu-heading">
          <h2 id="menu-heading">飲料菜單</h2>
          <ul class="drink-grid"></ul>
          <noscript><p>請啟用 JavaScript 以使用飲料菜單與購物車。</p></noscript>
        </section>

        <section id="cart" aria-labelledby="cart-heading">
          <h2 id="cart-heading" tabindex="-1">購物車</h2>
          <div class="cart-panel">
            <p class="empty-cart">購物車是空的</p>
            <ul class="cart-items" id="cart-list" hidden></ul>
            <dl class="cart-totals" aria-live="polite" aria-atomic="true">
              <div>
                <dt>總杯數</dt>
                <dd id="cart-total-qty">0 杯</dd>
              </div>
              <div>
                <dt>折扣前總金額</dt>
                <dd id="cart-total-price">NT$ 0</dd>
              </div>
              <div>
                <dt>滿 NT$ 200 折 NT$ 20</dt>
                <dd id="cart-discount">NT$ 0</dd>
              </div>
              <div>
                <dt>折扣後總金額</dt>
                <dd id="cart-final-price">NT$ 0</dd>
              </div>
            </dl>
            <div class="cart-actions">
              <button type="button" class="checkout-button" disabled>
                結帳
              </button>
              <button type="button" class="clear-cart-button" disabled>
                清空購物車
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>
    <template id="drink-template">
      <li class="drink-card">
        <div class="drink-art" aria-hidden="true">
          <span class="tea-cup"></span>
        </div>
        <div class="drink-content">
          <h3></h3>
          <p></p>
          <div class="drink-actions">
            <strong></strong>
            <button type="button">加入</button>
          </div>
        </div>
      </li>
    </template>
    <template id="cart-item-template">
      <li>
        <h3></h3>
        <p class="item-price"></p>
        <div class="cart-item-actions">
          <div class="quantity-controls" role="group">
            <button type="button" class="decrease-quantity">−</button>
            <span class="item-quantity"></span>
            <button type="button" class="increase-quantity">+</button>
          </div>
          <strong class="item-subtotal"></strong>
        </div>
      </li>
    </template>
    <div class="mobile-cart">
      <button
        type="button"
        class="mobile-cart-button"
        aria-controls="cart"
        aria-describedby="cart-kind-count"
      >
        購物車
      </button>
      <span class="mobile-cart-badge" id="cart-kind-count" aria-label="0 種商品"
        >0</span
      >
    </div>
    <button type="button" class="back-to-top" hidden>回到頂部</button>
    <dialog class="cart-dialog" aria-labelledby="pop-up-title">
      <div class="filter" aria-hidden="true"></div>
      <div class="pop-up">
        <h3 class="pop-up__title" id="pop-up-title" tabindex="-1"></h3>
        <div class="pop-up__text" hidden></div>
        <form class="pop-up__btn-group" method="dialog">
          <button type="button" class="confirm-btn">確認</button>
          <button type="button" class="cancel-btn">取消</button>
        </form>
      </div>
    </dialog>
    <script src="./js/購物車.js" defer></script>
  </body>
</html>
